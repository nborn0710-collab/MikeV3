name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip Files
      run: |
        unzip -o MikeV3_Project_updated.zip || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        if [ -f "./MikeV3/build_mike.sh" ]; then
          cd MikeV3 && chmod +x build_mike.sh && ./build_mike.sh
        elif [ -f "./build_mike.sh" ]; then
          chmod +x build_mike.sh && ./build_mike.sh
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MikeV3-App
        path: "**/*.apk"
        
